name: refx lazer build

on:
  push:
    branches: [refx]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# contents: write is needed to create the GitHub release that Velopack's
# GithubSource reads. Nothing else is granted.
permissions:
  contents: write

jobs:
  build:
    # lazer is a big solution and hosted runners are memory-bound, so never
    # build the whole .sln (it drags in every test project). osu.Desktop
    # pulls in osu.Game + the four rulesets transitively, which is all the
    # client needs.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # velopack requires a monotonic version to decide whether an update exists.
      # run_number increases monotonically per workflow, and 1.0.<n> is a valid
      # semver that sorts correctly. Also baked into the assembly so that
      # OsuGameBase.IsDeployedBuild is true (otherwise the updater is disabled).
      - name: compute version
        shell: bash
        run: |
          version="1.0.${{ github.run_number }}"
          echo "REFX_VERSION=$version" >> "$GITHUB_ENV"
          echo "REFX_TAG=v$version" >> "$GITHUB_ENV"
          echo "building $version"

      - name: restore
        run: dotnet restore osu.Desktop/osu.Desktop.csproj

      # Release matters for more than speed: OsuGameBase.UseDevelopmentServer is
      # `DebugUtils.IsDebugBuild`, so a Debug build silently points the client
      # at dev.ppy.sh instead of production.
      - name: publish
        run: dotnet publish osu.Desktop/osu.Desktop.csproj -c Release -p:Version=$REFX_VERSION -o publish/out

      # Log what we actually produced. Game assets (textures, audio samples,
      # tracks) are EmbeddedResource in osu.Game.Resources.csproj, so they
      # should be sitting inside osu.Game.Resources.dll rather than in a
      # Resources/ folder -- the biggest-files listing below is how we confirm
      # that instead of assuming it.
      - name: inspect publish output
        shell: bash
        run: |
          echo "total size:"
          du -sh publish/out
          echo "file count:"
          ls publish/out | wc -l
          echo "10 largest files:"
          find publish/out -type f -printf '%s %p\n' | sort -rn | head -10 \
            | awk '{ printf "%8.1f MB  %s\n", $1/1048576, $2 }'
          echo "executable present?"
          ls -la publish/out/osu!.exe 2>/dev/null || echo "(missing osu!.exe)"

      # ── velopack packaging ──────────────────────────────────────────────────
      # Produces Setup.exe (one-time installer) plus the .nupkg full/delta
      # packages that the in-game updater consumes via GithubSource. This is
      # what makes updates work from inside the game.
      - name: install velopack cli
        shell: bash
        run: |
          dotnet tool install -g vpk --version 1.2.161
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          vpk --version

      - name: velopack pack
        shell: bash
        run: |
          vpk pack \
            --packId refx-lazer \
            --packVersion "$REFX_VERSION" \
            --packDir publish/out \
            --mainExe osu!.exe \
            --packTitle "re;fx lazer" \
            --packAuthors "refx-online" \
            --outputDir velo-out
          ls -la velo-out/

      # Release is what GithubSource polls. Marked non-prerelease because
      # VelopackUpdateManager only asks for prereleases on the tachyon stream.
      # Assets are the installer + packages; the zip from later steps is a
      # separate fallback and deliberately not attached here.
      - name: publish velopack release
        if: github.ref == 'refs/heads/refx' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # replace an existing tag if this run_number was retried, otherwise
          # gh release create fails on the duplicate tag
          gh release delete "$REFX_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$REFX_TAG" \
            --title "re;fx lazer $REFX_VERSION" \
            --notes "Automated build ${{ github.run_number }} from ${{ github.sha }}." \
            velo-out/*

      # Everything above is the velopack path (in-game updates). It runs before
      # the zip so a packaging failure surfaces in ~2min rather than after the
      # slow archive, and before the updater upload so the two paths stay
      # independent.
      - name: archive
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          # filename must not contain slashes: the updater upload route
          # rejects them, and everything lands flat in one prefix.
          name="osu-lazer-${SHA}.zip"
          echo "ARCHIVE_NAME=$name" >> "$GITHUB_ENV"
          7z a -tzip -mx=5 "$name" ./publish/out/*

      # The archive is ~300MB and goes up through the cloudflared tunnel, which
      # imposes TWO limits (both measured against updater.041095.xyz):
      #   - request bodies over ~100MB are rejected with 413
      #   - the origin must respond within ~100s or cloudflare returns 524
      # Throughput is roughly 0.55MB/s, so 64MB parts took ~115-125s each and
      # failed intermittently. 20MB lands in ~35s, comfortably inside the
      # window. The zip is split and the client concatenates the parts back
      # together in manifest order.
      - name: split archive
        shell: bash
        run: |
          mkdir -p parts
          split -b 20M -d -a 3 "$ARCHIVE_NAME" "parts/${ARCHIVE_NAME}.part."
          ls -la parts/ | head -5
          echo "part count: $(ls parts | wc -l)"
          echo "ARCHIVE_PARTS=$(ls parts | wc -l)" >> "$GITHUB_ENV"

      - name: manifest
        shell: bash
        env:
          SHA: ${{ github.sha }}
          ARCHIVE_NAME: ${{ env.ARCHIVE_NAME }}
          BUILD_NUMBER: ${{ github.run_number }}
          ARCHIVE_PARTS: ${{ env.ARCHIVE_PARTS }}
        run: |
          size=$(stat -c %s "$ARCHIVE_NAME")
          md5=$(md5sum "$ARCHIVE_NAME" | cut -d' ' -f1)

          # build the parts array by hand -- jq isn't guaranteed on the runner
          parts_json=""
          sep=""
          for f in parts/*; do
            psize=$(stat -c %s "$f")
            pmd5=$(md5sum "$f" | cut -d' ' -f1)
            parts_json="${parts_json}${sep}{\"name\": \"$(basename "$f")\", \"size\": ${psize}, \"md5\": \"${pmd5}\"}"
            sep=","
          done

          cat > latest.json <<EOF
          {
            "version": "${SHA}",
            "build": ${BUILD_NUMBER},
            "filename": "${ARCHIVE_NAME}",
            "size": ${size},
            "md5": "${md5}",
            "parts": [${parts_json}],
            "part_count": ${ARCHIVE_PARTS},
            "repository": "refx-online/refx-lazer",
            "branch": "${GITHUB_REF_NAME}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat latest.json

      - name: upload client
        uses: actions/upload-artifact@v4
        with:
          name: osu-lazer
          path: |
            ${{ env.ARCHIVE_NAME }}
            latest.json

      # publish straight to the updater so the windows box can pull the build
      # without touching github. branch-gated: never on PRs or manual runs from
      # other branches, so a test run can't overwrite the good artifact.
      # needs repo secrets: UPDATER_BASE_URL, UPDATER_UPLOAD_TOKEN.
      - name: publish to updater
        if: github.ref == 'refs/heads/refx' && github.event_name == 'push'
        shell: bash
        env:
          UPDATER_BASE_URL: ${{ secrets.UPDATER_BASE_URL }}
          UPLOAD_TOKEN: ${{ secrets.UPDATER_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail

          # 4 at a time: sequential 20MB parts would take ~9 minutes of pure
          # upload, this is ~2.5. xargs exits non-zero if any upload fails,
          # which combined with `set -e` aborts before latest.json is written.
          upload_part() {
            curl -sf -m 300 --retry 3 --retry-delay 5 -X POST \
              -H "Authorization: Bearer $UPLOAD_TOKEN" \
              --data-binary "@parts/$1" "$UPDATER_BASE_URL/resources/lazer/$1"
          }
          export -f upload_part
          ls parts | xargs -P 4 -I{} bash -c 'upload_part "$@"' _ {}

          # manifest last: it is what the client polls, so uploading it only
          # after every part is confirmed means a client can never see a
          # manifest pointing at parts that aren't all there yet.
          echo "uploading latest.json"
          curl -sf -m 60 -X POST -H "Authorization: Bearer $UPLOAD_TOKEN" \
            --data-binary "@latest.json" "$UPDATER_BASE_URL/resources/lazer/latest.json"
          echo
          echo "published $(grep -o '"part_count": [0-9]*' latest.json)"