name: refx lazer build

on:
  push:
    branches: [refx]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# contents: write is needed to create the GitHub release that Velopack's
# GithubSource reads. Nothing else is granted.
permissions:
  contents: write

jobs:
  build:
    # lazer is a big solution and hosted runners are memory-bound, so never
    # build the whole .sln (it drags in every test project). osu.Desktop
    # pulls in osu.Game + the four rulesets transitively, which is all the
    # client needs.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # velopack requires a monotonic version to decide whether an update exists.
      # run_number increases monotonically per workflow, and 1.0.<n> is a valid
      # semver that sorts correctly. Also baked into the assembly so that
      # OsuGameBase.IsDeployedBuild is true (otherwise the updater is disabled).
      - name: compute version
        shell: bash
        run: |
          version="1.0.${{ github.run_number }}"
          echo "REFX_VERSION=$version" >> "$GITHUB_ENV"
          echo "REFX_TAG=v$version" >> "$GITHUB_ENV"
          echo "building $version"

      - name: restore
        run: dotnet restore osu.Desktop/osu.Desktop.csproj

      # Release matters for more than speed: OsuGameBase.UseDevelopmentServer is
      # `DebugUtils.IsDebugBuild`, so a Debug build silently points the client
      # at dev.ppy.sh instead of production.
      # shell: bash matters here -- without it this runs under pwsh, where
      # $REFX_VERSION is an unset PowerShell variable rather than the env var,
      # and the argument silently degrades to a bare "-p:Version=".
      - name: publish
        shell: bash
        run: dotnet publish osu.Desktop/osu.Desktop.csproj -c Release -p:Version="$REFX_VERSION" -o publish/out

      # Log what we actually produced. Game assets (textures, audio samples,
      # tracks) are EmbeddedResource in osu.Game.Resources.csproj, so they
      # should be sitting inside osu.Game.Resources.dll rather than in a
      # Resources/ folder -- the biggest-files listing below is how we confirm
      # that instead of assuming it.
      - name: inspect publish output
        shell: bash
        run: |
          echo "total size:"
          du -sh publish/out
          echo "file count:"
          ls publish/out | wc -l
          echo "10 largest files:"
          find publish/out -type f -printf '%s %p\n' | sort -rn | head -10 \
            | awk '{ printf "%8.1f MB  %s\n", $1/1048576, $2 }'
          echo "executable present?"
          ls -la publish/out/osu!.exe 2>/dev/null || echo "(missing osu!.exe)"

      # ── velopack packaging ──────────────────────────────────────────────────
      # Produces Setup.exe (one-time installer) plus the .nupkg full/delta
      # packages that the in-game updater consumes via GithubSource. This is
      # what makes updates work from inside the game.
      - name: install velopack cli
        shell: bash
        run: |
          dotnet tool install -g vpk --version 1.2.161
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          # NOTE: don't probe with `vpk --version` -- vpk requires a subcommand and
          # exits non-zero on a bare flag. `dotnet tool list` is the safe check.
          dotnet tool list --global | grep -q '^vpk ' || { echo "vpk missing after install"; exit 1; }
          echo "vpk installed: $(dotnet tool list --global | grep '^vpk ')"

      - name: velopack pack
        shell: bash
        run: |
          # --runtime matters: without it vpk defaults to x86, but lazer ships
          # win-x64 natives (and the warning says so). --runtime also pins which
          # runtime vpk asks the installer to check for.
          vpk pack \
            --packId refx-lazer \
            --packVersion "$REFX_VERSION" \
            --packDir publish/out \
            --mainExe "osu!.exe" \
            --runtime win-x64 \
            --packTitle "re;fx lazer" \
            --packAuthors "refx-online"

          # vpk writes to a top-level Releases/ dir (it logs "Releases Directory:")
          # and names the installer <packId>-win-Setup.exe. Don't hardcode the dir
          # as the only option -- collect from the plausible ones and fail loudly
          # if nothing turns up, so an assetless release can never be published.
          # Must copy assets*.json as well as the packages: `vpk upload github`
          # refuses to run without the channel's assets file ("Could not find
          # assets file for channel 'win'"), and that file is produced by
          # `vpk pack`, not by the installer.
          mkdir -p velo-out
          found=0
          for d in Releases dist publish/dist; do
            [ -d "$d" ] || continue
            if find "$d" -maxdepth 1 -type f -name '*.nupkg' | grep -q .; then
              # copy the whole directory. Enumerating assets by name kept missing
              # ones: `vpk upload` wants the portable zip as well as the setup
              # exe, the full nupkg and assets.win.json, and failed with
              # "Could not find file 'refx-lazer-win-Portable.zip'".
              cp -a "$d"/. velo-out/
              found=1
              break
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "::error::no velopack artifacts (*.nupkg) were produced"
            ls -la Releases 2>/dev/null || echo "(no Releases dir either)"
            exit 1
          fi
          ls -la velo-out/
          if ! ls velo-out/assets*.json >/dev/null 2>&1; then
            echo "::error::vpk produced no assets*.json -- the upload step would fail"
            exit 1
          fi

      # This MUST be `vpk upload github`, not `gh release create`.
      #
      # VelopackUpdateManager resolves updates through a GithubSource, which
      # fetches the release asset `releases.win.json` (Sources/GitBase.cs ->
      # CoreUtil.GetVeloReleaseIndexName, channel "win" for Windows) to discover
      # available packages. Only the vpk github upload path writes that index --
      # `gh release create` attaches the .nupkg and Setup.exe and nothing else,
      # so the in-game updater found no updates at all. Verified against vpk
      # 1.2.161's _GitRelease.cs, which uploads releasesFileName alongside the
      # packages.
      - name: publish velopack release
        if: github.ref == 'refs/heads/refx' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # replace an existing tag if this run_number was retried, otherwise the
          # upload fails on the duplicate release
          gh release delete "$REFX_TAG" --yes --cleanup-tag 2>/dev/null || true
          # no -c/--channel: vpk's Windows default is "win", which is the channel
          # GithubSource asks for and therefore the index filename the client
          # looks for. Passing a different one silently breaks updates again.
          vpk upload github \
            --repoUrl "https://github.com/refx-online/refx-lazer" \
            --token "$GH_TOKEN" \
            --publish \
            --tag "$REFX_TAG" \
            --releaseName "re;fx lazer $REFX_VERSION" \
            -o velo-out
          echo "--- assets now on the release ---"
          gh release view "$REFX_TAG" --json assets --jq '.assets[].name'

      # Everything above is the velopack path (in-game updates). It runs before
      # the zip so a packaging failure surfaces in ~2min rather than after the
      # slow archive.
      #
      # The zip exists only so the build can be downloaded from this run's page.
      # Updates go through Velopack's GithubSource against this repo's
      # releases -- see `osu.Desktop/Updater/VelopackUpdateManager.cs`, which
      # is the only update source the client has. Nothing reads a latest.json
      # manifest, so the chunked upload this workflow used to do was ~320MB of
      # traffic per push toward a path no client consulted, and its xargs
      # upload failed roughly every other run for no benefit.
      - name: archive
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          name="osu-lazer-${SHA}.zip"
          echo "ARCHIVE_NAME=$name" >> "$GITHUB_ENV"
          7z a -tzip -mx=5 "$name" ./publish/out/*

      - name: upload client
        uses: actions/upload-artifact@v4
        with:
          name: osu-lazer
          path: ${{ env.ARCHIVE_NAME }}
